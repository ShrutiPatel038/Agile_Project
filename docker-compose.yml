services:

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks:
      - evgo-net
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/ev-go?replicaSet=rs0
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - evgo-net
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle, so it must be reachable from the host browser
        # (the "backend" service name only resolves inside the Docker network)
        VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    networks:
      - evgo-net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  backend-uploads:

networks:
  evgo-net:
    driver: bridge
